---
pg_os_user: postgres
pg_version: "17"
pg_bin_dir: "/usr/pgsql-{{ pg_version }}/bin"
pg_socket_dir: /var/run/postgresql
pg_service: "postgresql-{{ pg_version }}"

# Patroni cluster: parameters go to the DCS with patronictl (run once per
# cluster, on the leader). Standalone: ALTER SYSTEM.
pg_patroni: false
pg_patroni_config: /etc/patroni/patroni.yml

# ---- DB-10 Logging (CIS PostgreSQL 3.x). Reload only. ----
pg_logging: true
pg_logging_params:
  log_connections: "on"
  log_disconnections: "on"
  log_statement: ddl
  log_replication_commands: "on"
  log_error_verbosity: verbose
  log_line_prefix: "%m [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h "

# ---- DB-11 TLS ciphers and server TLS (CIS 6.x). ssl=on needs cert + key in place. ----
pg_tls: false
pg_tls_params:
  ssl: "on"
  ssl_cert_file: "/var/lib/pgsql/{{ pg_version }}/ssl/server.crt"
  ssl_key_file: "/var/lib/pgsql/{{ pg_version }}/ssl/server.key"
  ssl_min_protocol_version: TLSv1.2
  ssl_ciphers: "HIGH:!MEDIUM:!3DES:!aNULL:!eNULL:!MD5:!RC4"

# ---- DB-12 passwordcheck module. Needs a restart (rolling, replicas first). ----
pg_passwordcheck: false

# ---- DB-13 Remove local "trust" from pg_hba.conf ----
# local all/replication trust -> peer; host 127.0.0.1/32 and ::1/128 trust lines
# removed. Validated with pg_hba_file_rules before reload, auto-restore on error.
# If Patroni manages pg_hba in the DCS (postgresql.pg_hba), change it there instead.
pg_remove_local_trust: false
