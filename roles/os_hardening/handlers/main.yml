---
- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded
  when: allow_restart | bool

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when: allow_restart | bool

- name: Save iptables
  ansible.builtin.command: /usr/libexec/iptables/iptables.init save
  changed_when: true
