---
tomcat_base: /opt/tomcat
tomcat_server_xml: "{{ tomcat_base }}/conf/server.xml"
tomcat_service: tomcat
# URL that must answer tomcat_health_status after a restart, else auto-rollback.
tomcat_health_url: http://127.0.0.1:8080/
tomcat_health_status: [200, 302, 404]
tomcat_health_retries: 12
tomcat_health_delay: 10

# ---- WEB-01 Hide version and stack traces on error pages ----
tomcat_error_valve: true
# ---- WEB-02 Disable the AJP connector (Ghostcat class) ----
# Check first that nothing connects: ss -Htn state established '( sport = :8009 )'
tomcat_disable_ajp: true
tomcat_ajp_port: 8009
