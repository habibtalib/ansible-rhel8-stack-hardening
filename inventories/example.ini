# Example inventory. Addresses are RFC 5737 documentation ranges (192.0.2.0/24,
# 198.51.100.0/24). Replace with your own hosts; keep real inventories out of git
# (see .gitignore: inventories/*.ini except this file).

[haproxy_hosts]
lb-a1.example.internal   ansible_host=192.0.2.10

[postgresql_hosts]
db-pg-a1.example.internal ansible_host=192.0.2.21
db-pg-a2.example.internal ansible_host=192.0.2.22
db-pg-a3.example.internal ansible_host=192.0.2.23

[oracle_hosts]
db-ora-a1.example.internal ansible_host=192.0.2.31
db-ora-b1.example.internal ansible_host=198.51.100.31

[tomcat_hosts]
db-ora-a1.example.internal
db-ora-b1.example.internal

[docker_hosts]
mgmt-a1.example.internal ansible_host=192.0.2.41

[mysql_hosts]
mgmt-a1.example.internal

[mongodb_hosts]
mgmt-a1.example.internal

[fleet:children]
haproxy_hosts
postgresql_hosts
oracle_hosts
docker_hosts

[docker_hosts:vars]
docker_host=true
